    function isRecommended(platform) {
      const ua = navigator.userAgent.toLowerCase();
      if (/iphone|ipad|ipod/.test(ua) || (/macintosh/.test(ua) && navigator.maxTouchPoints > 1))
        return platform === "ios";
      if (/harmonyos|openharmony/.test(ua)) return platform === "harmonyos";
      if (/android/.test(ua)) return platform === "android";
      return false;
    }
    function apkDownloadUrl(release) {
      if (typeof release.downloadUrl !== "string" || !release.downloadUrl.trim())
        throw new Error("Android 下载地址缺失");
      const target = new URL(release.downloadUrl, `${apiBase}/`);
      if (
        target.origin !== apiBase ||
        target.username ||
        target.password ||
        target.pathname !== "/app/app_update/download" ||
        target.searchParams.get("id") !== release.versionId ||
        target.hash
      )
        throw new Error("Android 下载地址与发布版本不匹配");
      return target.href;
    }
    function validateInfo(info) {
      if (
        !info ||
        typeof info.appId !== "string" ||
        info.appId !== DOWNLOAD_PAGE_CONFIG.appId.trim() ||
        typeof info.name !== "string" ||
        !Array.isArray(info.platforms) ||
        info.platforms.length !== 3
      )
        throw new Error("下载信息中的 App 或平台数据不完整，请重试或联系管理员");
      return Object.keys(labels).map((platform) => {
        const matches = info.platforms.filter((item) => item && item.platform === platform);
        if (matches.length !== 1 || typeof matches[0].available !== "boolean")
          throw new Error("下载信息中的平台缺失、重复或状态无效");
        const item = matches[0];
        if (!item.available) {
          if (item.release != null) throw new Error("不可用平台包含异常版本信息");
          return item;
        }
        const release = item.release;
        if (
          !release ||
          release.hasUpdate !== true ||
          release.platform !== platform ||
          typeof release.packageName !== "string" ||
          !release.packageName.trim() ||
          typeof release.versionId !== "string" ||
          !/^\d+$/.test(release.versionId) ||
          !Number.isSafeInteger(release.versionCode) ||
          release.versionCode <= 0
        )
          throw new Error(`${labels[platform][0]} 版本信息无效`);
        if (platform === "android") {
          if (
            release.updateMethod !== "apk" ||
            ![undefined, "managed", "external"].includes(release.downloadSource)
          )
            throw new Error("Android 下载方式无效");
          apkDownloadUrl(release);
          if (
            release.downloadSource !== "external" &&
            (!Number.isSafeInteger(release.fileSize) ||
              release.fileSize <= 0 ||
              !/^[a-f\d]{64}$/i.test(release.sha256 || ""))
          )
            throw new Error("Android APK 文件信息不完整");
        } else if (release.updateMethod !== "store" || !officialStoreUrl(platform, release.storeUrl))
          throw new Error(`${labels[platform][0]} 官方商店地址无效`);
        return item;
      });
    }
    function makeCard(item) {
      const platform = item.platform,
        label = labels[platform] || [platform, "", "•"],
        release = item.release || {};
      const available = item.available;
      const card = document.createElement("article");
      card.className = `platform-card${available ? "" : " developing"}${
        isRecommended(platform) ? " recommended" : ""
      }`;
      const head = document.createElement("div");
      head.className = "platform-head";
      const icon = document.createElement("div");
      icon.className = "platform-icon";
      icon.textContent = label[2];
      const title = document.createElement("div");
      title.innerHTML = `<div class="platform-name"></div><div class="platform-subtitle"></div>`;
      title.querySelector(".platform-name").textContent = label[0];
      title.querySelector(".platform-subtitle").textContent = label[1];
      head.append(icon, title);
      card.append(head);
      if (isRecommended(platform)) {
        const badge = document.createElement("span");
        badge.className = "device-badge";
        badge.textContent = "适合当前设备";
        card.append(badge);
      }
      const releaseInfo = document.createElement("div");
      releaseInfo.className = "release";
      const releaseName = document.createElement("div");
      releaseName.className = "release-name";
      const releaseMeta = document.createElement("div");
      releaseMeta.className = "release-meta";
      if (available) {
        releaseName.textContent = `v${release.versionName || release.versionCode || "最新版本"}`;
        const detail = [
          `构建 ${release.versionCode}`,
          formatDate(release.publishTime) && `发布于 ${formatDate(release.publishTime)}`
        ];
        if (platform === "android")
          detail.push(
            release.downloadSource === "external"
              ? "外部 APK 链接 · 大小以实际下载为准"
              : formatSize(release.fileSize)
          );
        releaseMeta.textContent = detail.filter(Boolean).join(" · ");
      } else {
        releaseName.textContent = "开发中";
        releaseMeta.textContent = "该平台版本正在准备，敬请期待";
      }
      releaseInfo.append(releaseName, releaseMeta);
      card.append(releaseInfo);
      const note = document.createElement("p");
      note.className = "release-note";
      note.textContent = available
        ? release.content || "暂无更新说明"
        : "我们正在为该平台准备应用版本，完成后会在这里提供下载。";
      card.append(note);
      const button = document.createElement(available ? "a" : "button");
      button.className = `action${available ? "" : " secondary"}`;
      if (!available) {
        button.type = "button";
        button.disabled = true;
        button.textContent = "开发中";
      } else if (platform === "android") {
        button.textContent = "下载 APK";
        button.href = apkDownloadUrl(release);
        button.rel = "noreferrer";
        button.referrerPolicy = "no-referrer";
      } else {
        button.textContent = platform === "ios" ? "前往 App Store" : "前往华为应用市场";
        button.href = officialStoreUrl(platform, release.storeUrl);
        button.target = "_blank";
        button.rel = "noopener noreferrer";
      }
      card.append(button);
      return card;
    }
    function render(info) {
      const items = validateInfo(info),
        cards = items.map(makeCard);
      setBrand(info);
      platformsRoot.replaceChildren(...cards);
      stateRoot.classList.add("hidden");
      platformsRoot.classList.remove("hidden");
    }
    function showError(message) {
      stateRoot.replaceChildren();
      const title = document.createElement("h2"),
        detail = document.createElement("p"),
        retry = document.createElement("button");
      title.textContent = "暂时无法加载下载信息";
      detail.textContent = message || "请检查网络后重试";
      retry.textContent = "重新加载";
      retry.onclick = load;
      stateRoot.append(title, detail, retry);
      stateRoot.classList.remove("hidden");
      platformsRoot.classList.add("hidden");
    }
    async function load() {
      if (loading) return;
      if (
        typeof DOWNLOAD_PAGE_CONFIG.appId !== "string" ||
        !/^\d+$/.test(DOWNLOAD_PAGE_CONFIG.appId.trim())
      ) {
        showError("请在页面配置中填写加引号的后台 App ID 字符串");
        return;
      }
      loading = true;
      platformsRoot.setAttribute("aria-busy", "true");
      stateRoot.replaceChildren();
      const loadingMessage = document.createElement("p");
      loadingMessage.textContent = "正在获取最新版本…";
      stateRoot.append(loadingMessage);
      stateRoot.classList.remove("hidden");
      platformsRoot.classList.add("hidden");
      const controller = new AbortController();
      const timeoutMs = DOWNLOAD_PAGE_CONFIG.requestTimeoutMs;
      const timer = setTimeout(
        () => controller.abort(),
        Number.isFinite(timeoutMs) && timeoutMs > 0 ? timeoutMs : 15000
      );
      try {
        apiBase = configuredApiBase();
        const url = new URL("/app/app_update/download/info", `${apiBase}/`);
        url.searchParams.set("appId", DOWNLOAD_PAGE_CONFIG.appId.trim());
        const response = await fetch(url, {
          signal: controller.signal,
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error(`服务器响应异常（${response.status}）`);
        if (!/application\/(?:[\w.-]+\+)?json\b/i.test(response.headers.get("Content-Type") || ""))
          throw new Error("服务器未返回 JSON 下载信息，请检查 API 地址和代理配置");
        const result = await response.json();
        if (!result || result.code !== 1000)
          throw new Error((result && result.message) || "下载信息获取失败");
        render(result.data);
      } catch (error) {
        showError(
          controller.signal.aborted
            ? "获取下载信息超时，请检查网络后重试"
            : error && error.message
            ? error.message
            : "请检查网络后重试"
        );
      } finally {
        clearTimeout(timer);
        loading = false;
        platformsRoot.setAttribute("aria-busy", "false");
      }
    }
    function drawQR(text) {
      const qr = new QRCodeModel(-1, QRErrorCorrectLevel.M);
      qr.addData(text);
      qr.make();
      const canvas = $("#qrCanvas"),
        context = canvas.getContext("2d"),
        count = qr.getModuleCount(),
        quiet = 4,
        cells = count + quiet * 2,
        step = canvas.width / cells;
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#25334a";
      for (let row = 0; row < count; row++)
        for (let col = 0; col < count; col++)
          if (qr.isDark(row, col))
            context.fillRect(
              Math.round((col + quiet) * step),
              Math.round((row + quiet) * step),
              Math.ceil(step),
              Math.ceil(step)
            );
    }
    try {
      drawQR(DOWNLOAD_PAGE_CONFIG.downloadPageUrl || `${location.origin}${location.pathname}`);
    } catch (_) {
      $("#qrBox").classList.add("hidden");
    }
    setBrand({});
    load();
  </script>

</body>
</html>
